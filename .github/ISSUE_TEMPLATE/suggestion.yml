name: 建議 / Suggestion
description: 希望 Retis Terminal 多做什麼或改什麼 / Something Retis Terminal could do better
labels: ["建議"]
body:
  - type: textarea
    id: idea
    attributes:
      label: 您的建議 / Your suggestion
      description: 您想做什麼，現在哪裡不方便。 / What you want to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 這會幫您做到什麼？ / What would it help you do?
