name: 問題 / Problem
description: 有東西不能用或不如預期 / Something doesn't work as expected
labels: ["問題"]
body:
  - type: markdown
    attributes:
      value: |
        請不要貼上密碼、API 金鑰，或 Retis Terminal 分頁網址列裡 `#local-access=` 之後的內容。Never paste passwords, API keys, or anything after `#local-access=` in the Retis Terminal tab's address bar.
  - type: textarea
    id: what
    attributes:
      label: 發生了什麼？ / What happened?
      description: 您做了什麼、預期看到什麼、實際看到什麼。 / What you did, what you expected, what you saw.
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: 電腦 / Computer
      description: 請選擇您的電腦。 / Choose your computer.
      options: ["Mac", "Windows"]
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: 版本 / Version
      description: Retis Terminal 圖示選單第一行的版本號（以 -beta 結尾）。 / The version on the first line of the Retis Terminal icon menu (it ends in -beta).
  - type: input
    id: browser
    attributes:
      label: 瀏覽器 / Browser
      description: 例如 Chrome 131、Edge 131 或 Safari 18（瀏覽器的「關於」頁有版本）。 / Such as Chrome 131, Edge 131 or Safari 18 (its About page shows the version).
  - type: textarea
    id: report
    attributes:
      label: 問題報告 / Problem report
      description: 在 Retis Terminal 開啟 Retis MAS 管理員，按「問題回報」，把它存下的 report-….zip 拖到這裡；Retis Terminal 打不開時，請看「回報問題」說明。報告不含密碼與金鑰，附加前請先看過。 / In Retis Terminal, open Retis MAS Manager, choose Problem report and drag the report-….zip it saves here; if Retis Terminal won't open, see Report a problem. It contains no passwords or keys; look it over before attaching.
